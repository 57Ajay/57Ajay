name: Update profile stats

on:
  push:
    paths:
      - ".github/workflows/profile-stats.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&include_all_commits=true&show=prs_merged&bg_color=ffffff&title_color=1f2328&text_color=59636e&icon_color=425cc7&border_color=d1d9e0&border_radius=12
          path: assets/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&include_all_commits=true&show=prs_merged&bg_color=0d1117&title_color=e6edf3&text_color=9198a1&icon_color=6f86f0&border_color=30363d&border_radius=12
          path: assets/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-light.svg assets/stats-dark.svg
          git commit -m "chore: refresh profile stats" || exit 0
          git push
